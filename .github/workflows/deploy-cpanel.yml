# Despliegue continuo automático de Backend Etronic hacia cPanel (backend_etronic) vía HTTPS 443
name: Validate & Deploy Backend to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-cpanel
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validar sintaxis Node y desplegar en backend_etronic (HTTPS 443)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 3. Verificar sintaxis de todos los módulos del Backend
        run: |
          node --check index.js
          node --check loader.cjs
          find src scripts -type f \( -name "*.js" -o -name "*.mjs" -o -name "*.cjs" \) -exec node --check {} +

      - name: 4. Enviar archivos de Backend y reiniciar Passenger vía HTTPS (Puerto 443)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.FTP_PASSWORD }}
        run: |
          node - << 'EOF'
          const fs = require("fs");
          const path = require("path");

          const rootDir = process.cwd();
          const files = {};
          const includeFiles = ["package.json", "package-lock.json", "loader.cjs", "index.js", ".env.example"];
          const includeDirs = ["src", "scripts", "bitácora"];

          for (const f of includeFiles) {
            const full = path.join(rootDir, f);
            if (fs.existsSync(full)) {
              files[f] = fs.readFileSync(full).toString("base64");
            }
          }

          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full);
              } else {
                const rel = path.relative(rootDir, full).replace(/\\/g, "/");
                files[rel] = fs.readFileSync(full).toString("base64");
              }
            }
          }
          includeDirs.forEach((d) => walk(path.join(rootDir, d)));

          // Señal tmp/restart.txt para reinicio automático de Phusion Passenger en cPanel
          files["tmp/restart.txt"] = Buffer.from(
            `Deployed commit ${process.env.GITHUB_SHA || "manual"} at ${new Date().toISOString()}\n`
          ).toString("base64");

          (async () => {
            const token = (process.env.DEPLOY_TOKEN || "").trim();
            if (!token) {
              console.error("Falta configurar el secret DEPLOY_TOKEN en GitHub.");
              process.exit(1);
            }

            const entries = Object.entries(files);
            const MAX_BATCH_BYTES = 2.5 * 1024 * 1024;
            const batches = [];
            let currentBatch = {};
            let currentBytes = 0;

            for (const [relPath, b64] of entries) {
              const itemBytes = relPath.length + b64.length + 16;
              if (currentBytes + itemBytes > MAX_BATCH_BYTES && Object.keys(currentBatch).length > 0) {
                batches.push(currentBatch);
                currentBatch = {};
                currentBytes = 0;
              }
              currentBatch[relPath] = b64;
              currentBytes += itemBytes;
            }
            if (Object.keys(currentBatch).length > 0) {
              batches.push(currentBatch);
            }

            console.log(`Enviando ${entries.length} archivos de Backend en ${batches.length} lote(s) a https://etronic.com.mx/deploy-hook.php ...`);
            for (let i = 0; i < batches.length; i++) {
              const batch = batches[i];
              const res = await fetch("https://etronic.com.mx/deploy-hook.php", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-Deploy-Token": token,
                },
                body: JSON.stringify({ target: "backend", files: batch }),
              });
              const text = await res.text();
              console.log(`Lote ${i + 1} HTTP ${res.status}:`, text);
              if (!res.ok) process.exit(1);
            }
          })();
          EOF
