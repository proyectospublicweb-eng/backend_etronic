name: Validate & Deploy Backend to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-cpanel
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validar sintaxis Node y desplegar Backend en cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verificar sintaxis de todos los módulos del Backend
        run: |
          node --check index.js
          node --check loader.cjs
          find src scripts -type f \( -name "*.js" -o -name "*.mjs" -o -name "*.cjs" \) -exec node --check {} +

      - name: Preparar paquete limpio y señal de reinicio Phusion Passenger (tmp/restart.txt)
        run: |
          mkdir -p _deploy_pkg/tmp
          cp index.js loader.cjs package.json package-lock.json .env.example _deploy_pkg/
          cp -r src scripts _deploy_pkg/
          if [ -d "bitácora" ]; then cp -r "bitácora" _deploy_pkg/; fi
          echo "Deployed commit ${GITHUB_SHA} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > _deploy_pkg/tmp/restart.txt

      - name: Desplegar Backend en cPanel y reiniciar Node automáticamente vía FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          local-dir: ./_deploy_pkg/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.local
            **/.env.production
            **/.htaccess
            **/node_modules/**
            **/data/**
            **/*.log
